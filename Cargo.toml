[package]
name = "synclaire"
version = "0.1.0"
edition = "2021"
authors = ["George Sam <george.sam@zohocorp.com>"]
license = "MIT"
description = "Transport-layer TCP/TLS library with guards, routing, and proxy primitives"
readme = "README.md"
documentation = "https://docs.rs/synclaire"
repository = "https://github.com/simclairsgs/synclaire"
homepage = "https://github.com/simclairsgs/synclaire"
keywords = ["tcp", "tls", "proxy", "client", "server"]
categories = ["network-programming", "asynchronous", "cryptography"]
rust-version = "1.70"
siminame = "Akibos"

[features]
default = ["async", "rustls-backend"]
async = ["dep:tokio", "dep:tokio-rustls", "dep:futures"]
sync = ["dep:futures"]
# TLS via rustls with the ring crypto provider (pure Rust, no C compiler required)
rustls-backend = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile", "rustls/ring"]
# TLS via rustls with the aws-lc-rs crypto provider (FIPS-capable, requires cmake)
aws-lc-backend = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile", "rustls/aws_lc_rs"]
full = ["async", "sync", "rustls-backend"]

[dependencies]
futures = { version = "0.3", optional = true }
log = "0.4"
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "time", "sync", "fs"], optional = true }
tokio-rustls = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3"
env_logger = "0.10"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[[example]]
name = "tcp-client-server-sync"
required-features = ["sync"]

[[example]]
name = "tls-client-server-sync"
required-features = ["sync", "rustls-backend"]

[[example]]
name = "mtls-client-server-sync"
required-features = ["sync", "rustls-backend"]

[[example]]
name = "mixed-client-server-sync"
required-features = ["sync", "rustls-backend"]

[[example]]
name = "proxy-usage"
required-features = ["sync"]
